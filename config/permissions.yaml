modules:
  dashboard:
    label: Dashboard
    actions:
      view: Ver Panel

  administration:
    label: Administración
    submodules:
      users:
        label: Usuarios
        actions:
          view: Ver
          create: Crear
          edit: Editar
          delete: Eliminar
          status: Cambiar Estado
      roles:
        label: Roles
        actions:
          view: Ver
          create: Crear
          edit: Editar
          delete: Eliminar
          assign_permissions: Asignar Permisos

  payment_gateway:
    label: Pasarela de Pagos
    actions:
      view: Ver
      create: Crear
      edit: Editar
      delete: Eliminar
      configure: Configurar

  clients:
    # Cubre TODAS las cuentas (Account), tanto clientes como negocios, distinguidas solo por
    # accountType — el módulo se llama "clients" por historia, pero AccountController usa este
    # mismo permiso para cualquier tipo de cuenta (ver "businesses" abajo para la única acción
    # que sí es específica de negocios: aprobar un registro pendiente).
    label: Cuentas (Clientes y Negocios)
    actions:
      view: Ver
      create: Crear
      edit: Editar
      delete: Eliminar
      details: Ver Detalles
      status: Cambiar Estado
      balance: Ver Saldo

  businesses:
    # Única acción real distinta de "clients": aprobar una cuenta de negocio que se autorregistró
    # y quedó pendiente (AccountController::approveBusiness). No es un CRUD aparte de negocios.
    label: Aprobación de Negocios
    actions:
      edit: Aprobar Negocio Pendiente

  payout_accounts:
    # Cuentas reales (bancarias/de pago) que un negocio registra para indicar a dónde debe
    # transferírsele el dinero al liquidar una conciliación (BusinessPayoutAccount). Solo aplica a
    # cuentas accountType=business.
    label: Cuentas de Pago de Negocios
    actions:
      view: Ver
      create: Crear
      edit: Editar
      delete: Eliminar

  authorized:
    label: Usuarios Autorizados
    actions:
      view: Ver
      create: Crear
      edit: Editar
      delete: Eliminar
      details: Ver Detalles
      status: Cambiar Estado
      verify: Verificar

  exchange:
    label: Tasas de Cambio
    submodules:
      providers:
        label: Proveedores
        actions:
          view: Ver
          create: Crear
          edit: Editar
          delete: Eliminar
      rates:
        label: Historial de Tasas
        actions:
          view: Ver
          fetch: Obtener Nuevas Tasas

  recharges:
    label: Recargas
    actions:
      view: Ver
      create: Crear
      details: Ver Detalles
      complete: Completar
      fail: Marcar Fallida
      cancel: Cancelar

  transfers:
    label: Transferencias
    actions:
      view: Ver
      create: Crear
      details: Ver Detalles
      process: Procesar
      cancel: Cancelar
      limits: Ver Límites

  invoices:
    label: Facturas
    actions:
      view: Ver
      create: Crear
      details: Ver Detalles
      pay: Pagar
      cancel: Cancelar
      refund: Reembolsar
      summary: Ver Resumen

  oauth_clients:
    label: Clientes OAuth2
    actions:
      view: Ver
      create: Crear
      edit: Editar
      delete: Eliminar
      status: Cambiar Estado

  currencies:
    label: Monedas
    actions:
      view: Ver
      create: Crear
      edit: Editar
      status: Cambiar Estado

  reconciliations:
    label: Conciliaciones con Negocios
    actions:
      view: Ver
      create: Crear
      details: Ver Detalles
      send: Enviar por WhatsApp
      approve: Aprobar
      settle: Liquidar Pago

  reconciliation:
    # Conciliación de una pasarela de pago contra los movimientos que reporta el externo
    # (ReconciliationController, distinto de "reconciliations" arriba que es con negocios).
    # OJO: hoy no tiene pantalla propia en el panel — solo endpoints JSON (/reconciliation/...),
    # sin link en el menú. El permiso ya existe porque el código lo exige (antes ningún rol lo
    # tenía y quedaba inaccesible incluso para super_admin); si no se va a usar todavía se puede
    # quitar de este archivo sin romper nada más.
    label: Conciliación Bancaria (Pasarelas)
    actions:
      run: Ejecutar
      view: Ver

  commission_settlements:
    # Liquidación de la comisión del sistema entre el Administrador (dueño de la cuenta física con
    # el dinero) y el Super Administrador (a quien le corresponde esa comisión). Distinto de
    # "reconciliations" (que es con negocios) — acá el "negocio" es el propio sistema.
    # create/approve/settle son pasos del Administrador; assign_account/close son del Super
    # Administrador (ver flujo completo en CommissionSettlement).
    label: Conciliación de Comisión del Sistema
    actions:
      view: Ver
      create: Crear
      details: Ver Detalles
      approve: Aprobar (Administrador)
      assign_account: Asignar Cuenta de Pago (Super Admin)
      settle: Liquidar Pago (Administrador)
      close: Cerrar (Super Admin)

  history:
    label: Historial
    actions:
      view: Ver
      export: Exportar
