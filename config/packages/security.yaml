security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        oauth_token:
            pattern: ^/oauth/
            stateless: true
            security: false
        api_public:
            pattern: ^/api/v1/(login|register|password-reset)
            stateless: true
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            entry_point: oauth2
            oauth2: true
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: admin_dashboard_page
                enable_csrf: true
            logout:
                path: app_logout
            # Frena fuerza bruta contra /login: máximo 5 intentos fallidos por minuto para el
            # mismo usuario+IP, y 50/hora agregado por IP (protege aunque roten el usuario).
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        - { path: ^/oauth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/(login|register|password-reset), roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/webhooks/, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/conciliacion, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
