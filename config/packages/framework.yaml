# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    #
    # handler_id explícito: guarda la sesión en la tabla "sessions" de Postgres en vez de
    # archivos locales del contenedor. Necesario porque el deploy corre (o puede correr) con
    # más de una réplica sin almacenamiento compartido — con sesiones en archivo, cada request
    # cae en un contenedor distinto y la sesión de otro no existe ahí (ver PdoSessionHandler
    # registrado en services.yaml, y la migración que crea la tabla "sessions").
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler

    #esi: true
    #fragments: true

    # Si el servidor real queda detrás de un reverse proxy (nginx delante de PHP-FPM en la misma
    # máquina, load balancer, etc.), sin esto Symfony ve la IP del proxy en vez de la del cliente
    # real (rompe logs/decisiones por IP) y puede no confiar en X-Forwarded-Proto, afectando si la
    # cookie de sesión se marca Secure correctamente detrás de un proxy que termina el TLS.
    #
    # "REMOTE_ADDR" es el valor especial documentado por Symfony para "confiar en quien sea que
    # esté hablando con PHP directamente" — funciona out-of-the-box para el caso típico (nginx en
    # el mismo host que PHP-FPM) sin tener que fijar una IP concreta. Si el proxy real está en otra
    # máquina/IP fija, cambiar TRUSTED_PROXIES por esa IP (o rango) en vez de dejar REMOTE_ADDR.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
